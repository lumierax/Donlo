# Save this file as .github/workflows/build-ios.yml in your GitHub repository.
# Upload Madar-iPhone12-Source.zip to the root of the same repository.
name: Build Madar IPA

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Source ZIP filename at the repository root"
        required: true
        default: "Madar-iPhone12-Source.zip"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare output folders
        run: mkdir -p "$GITHUB_WORKSPACE/ipa-output" "$GITHUB_WORKSPACE/build-logs"

      - name: Select Xcode 16.4 and show SDK
        run: |
          set -euo pipefail
          XCODE="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ ! -d "$XCODE" ]]; then
            echo "::error::Xcode 16.4 is missing from this runner. Check the macos-15 runner image."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE"
          {
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            swift --version
          } 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/environment.log"

      - name: Extract source ZIP
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/extraction.log"
          import hashlib, os, stat, tempfile, zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          name = os.environ["SOURCE_ZIP"]
          if any(c in name for c in "\r\n"):
              raise SystemExit("Invalid ZIP filename.")
          source = (workspace / name).resolve()
          if not source.is_relative_to(workspace) or not source.is_file():
              raise SystemExit("Source ZIP not found. Upload Madar-iPhone12-Source.zip to the repository root, or correct the input filename.")
          if source.suffix.lower() != ".zip" or not zipfile.is_zipfile(source):
              raise SystemExit("The selected source file is not a ZIP archive.")
          destination = Path(tempfile.mkdtemp(prefix="madar-source-", dir=os.environ["RUNNER_TEMP"]))
          with zipfile.ZipFile(source) as archive:
              if sum(item.file_size for item in archive.infolist()) > 512 * 1024 * 1024:
                  raise SystemExit("Source ZIP is unexpectedly large (over 512 MiB uncompressed).")
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if (path.is_absolute() or ".." in path.parts
                      or any(c in item.filename for c in "\\\r\n")
                      or stat.S_ISLNK(item.external_attr >> 16)):
                      raise SystemExit("Unsafe archive entry: " + repr(item.filename))
              archive.extractall(destination)
          projects = [p for p in destination.rglob("Madar.xcodeproj/project.pbxproj")
                      if "__MACOSX" not in p.parts]
          if len(projects) != 1:
              raise SystemExit("Expected exactly one Madar.xcodeproj inside the source ZIP.")
          project = projects[0].parent.parent
          for required in ("Scripts/build-unsigned.sh", "Scripts/check.sh", "Madar/Info.plist"):
              if not (project / required).is_file():
                  raise SystemExit("Required project file is missing: " + required)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("PROJECT_DIR=" + str(project) + "\n")
          print("Source:", source.name)
          with source.open("rb") as data:
              digest = hashlib.sha256()
              for block in iter(lambda: data.read(1024 * 1024), b""):
                  digest.update(block)
          print("Source SHA-256:", digest.hexdigest())
          print("Project:", project)
          PY

      - name: Validate project and run core tests
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash Scripts/check.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/checks.log"

      - name: Compile iPhone app and package unsigned IPA
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash Scripts/build-unsigned.sh 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/build.log"

      - name: Verify and collect IPA
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/ipa-validation.log"
          import os, plistlib, zipfile
          from pathlib import Path
          ipa = Path(os.environ["PROJECT_DIR"]) / "build/Madar-unsigned.ipa"
          with zipfile.ZipFile(ipa) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("IPA archive integrity check failed.")
              info = plistlib.loads(archive.read("Payload/Madar.app/Info.plist"))
              if "iPhoneOS" not in info.get("CFBundleSupportedPlatforms", []):
                  raise SystemExit("This is not an iPhone device build.")
              executable = info["CFBundleExecutable"]
              with archive.open("Payload/Madar.app/" + executable) as binary:
                  if binary.read(4) not in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xca\xfe\xba\xbe", b"\xca\xfe\xba\xbf"):
                      raise SystemExit("The app executable is not a Mach-O binary.")
              print("Bundle ID:", info.get("CFBundleIdentifier"))
              print("Minimum iOS:", info.get("MinimumOSVersion"))
              print("PASS: device IPA structure and executable. Signing and device testing are still required.")
          PY
          cp "$PROJECT_DIR/build/Madar-unsigned.ipa" "$GITHUB_WORKSPACE/ipa-output/"
          cd "$GITHUB_WORKSPACE/ipa-output"
          shasum -a 256 Madar-unsigned.ipa > SHA256.txt
          printf '%s\n' \
            'Madar - UNSIGNED iPhone IPA' \
            'This is an iPhone device build, not a Simulator build.' \
            'It is NOT signed, installed, or tested on your device by this workflow.' \
            'A valid signing/provisioning method is required before installation.' \
            'The project requires iOS 18.5 or later.' > READ-ME.txt

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madar-unsigned-IPA
          path: ipa-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload build logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madar-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Write build summary
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Madar iPhone build'
            printf 'Status: **%s**\n\n' "$BUILD_STATUS"
            if [[ "$BUILD_STATUS" == "success" ]]; then
              echo 'Download **Madar-unsigned-IPA** from Artifacts and extract Madar-unsigned.ipa.'
              echo 'The IPA still needs valid signing before installation. Minimum iOS: 18.5.'
            else
              echo 'Open the failed step and download **Madar-build-logs**, when available.'
              echo 'Do not treat a failed workflow as a successful app build.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
