name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build SiteMediaScanner
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      PROJECT_ZIP: SiteMediaScanner-iOS-v1.0.zip
      PROJECT_FILE: build-src/SiteMediaScanner-iOS/SiteMediaScanner.xcodeproj
      TARGET_NAME: SiteMediaScanner
      BUILD_DIR: ${{ github.workspace }}/build-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ZIP" || {
            echo "Missing $PROJECT_ZIP in repository root."
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src "$BUILD_DIR"
          mkdir -p build-src "$BUILD_DIR"
          unzip -q "$PROJECT_ZIP" -d build-src

          test -d "$PROJECT_FILE" || {
            echo "Xcode project not found at: $PROJECT_FILE"
            echo "Extracted files:"
            find build-src -maxdepth 4 -print
            exit 1
          }

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_FILE" \
            -target "$TARGET_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Verify built app
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$BUILD_DIR/SiteMediaScanner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app not found at: $APP_PATH"
            echo "Build output:"
            find "$BUILD_DIR" -maxdepth 3 -print || true
            exit 1
          fi

          echo "Built app: $APP_PATH"

      - name: Package simulator app
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts
          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            "$BUILD_DIR/SiteMediaScanner.app" \
            artifacts/SiteMediaScanner-Simulator.zip

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SiteMediaScanner-iOS-Simulator
          path: artifacts/SiteMediaScanner-Simulator.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
