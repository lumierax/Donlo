name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build SiteMediaScanner IPA
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      PROJECT_ZIP: SiteMediaScanner-iOS-v1.0.zip
      PROJECT_FILE: build-src/SiteMediaScanner-iOS/SiteMediaScanner.xcodeproj
      TARGET_NAME: SiteMediaScanner
      BUILD_DIR: ${{ github.workspace }}/build-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ZIP" || {
            echo "Missing $PROJECT_ZIP in repository root."
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src "$BUILD_DIR" Payload
          mkdir -p build-src "$BUILD_DIR"
          unzip -q "$PROJECT_ZIP" -d build-src

          test -d "$PROJECT_FILE" || {
            echo "Xcode project not found at: $PROJECT_FILE"
            find build-src -maxdepth 4 -print
            exit 1
          }

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build for iPhone device
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_FILE" \
            -target "$TARGET_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$BUILD_DIR/SiteMediaScanner.app"

          test -d "$APP_PATH" || {
            echo "Built app not found at: $APP_PATH"
            find "$BUILD_DIR" -maxdepth 3 -print || true
            exit 1
          }

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/zip -qry SiteMediaScanner-unsigned.ipa Payload

          test -f SiteMediaScanner-unsigned.ipa
          ls -lh SiteMediaScanner-unsigned.ipa

      - name: Create release tag
        id: release
        shell: bash
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Publish IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            SiteMediaScanner-unsigned.ipa \
            --title "SiteMediaScanner $TAG" \
            --notes "Automated unsigned iOS build from GitHub Actions."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
