name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build SiteMediaScanner
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      PROJECT_ZIP: SiteMediaScanner-iOS-v1.0.zip
      PROJECT_DIR: build-src/SiteMediaScanner-iOS
      PROJECT_FILE: build-src/SiteMediaScanner-iOS/SiteMediaScanner.xcodeproj
      TARGET_NAME: SiteMediaScanner
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ZIP" || {
            echo "Missing $PROJECT_ZIP in repository root."
            exit 1
          }

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$PROJECT_ZIP" -d build-src
          test -d "$PROJECT_FILE" || {
            echo "Xcode project not found at: $PROJECT_FILE"
            find build-src -maxdepth 4 -print
            exit 1
          }

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT_FILE"

      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_FILE" \
            -target "$TARGET_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Collect app
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$DERIVED_DATA/Build/Products" -type d -name 'SiteMediaScanner.app' -print -quit)"
          test -n "$APP_PATH" || {
            echo "Built .app was not found."
            exit 1
          }
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/SiteMediaScanner-Simulator.zip

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SiteMediaScanner-iOS-Simulator
          path: artifacts/SiteMediaScanner-Simulator.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
